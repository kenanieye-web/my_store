{% extends 'shop/base.html' %}

{% block title %}تسجيل الدخول{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm p-4">
                <h2 class="text-center mb-4 text-primary">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> تسجيل الدخول
                </h2>
                
            

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">

            
                        <label class="form-label fw-bold">البريد الإلكتروني</label>
                       <input type="email" name="username" class="form-control" required placeholder="name@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">كلمة المرور</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mt-3">
                        دخول
                    </button>
                </form>
                
                <div class="text-center mt-3">
                    <p class="text-muted">ليس لديك حساب؟ <a href="{% url 'register' %}" class="text-decoration-none fw-bold">أنشئ حساباً جديداً</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
