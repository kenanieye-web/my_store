{% extends 'shop/base.html' %}

{% block title %}إنشاء حساب جديد{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm p-4">
                <h2 class="text-center mb-4 text-primary">
                    <i class="fa-solid fa-user-plus me-2"></i> حساب جديد
                </h2>
                
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger">{{ message }}</div>
                    {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">الاسم الكامل</label>
                        <input type="text" name="full_name" class="form-control" required placeholder="مثال: محمد علي">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">البريد الإلكتروني</label>
                        <input type="email" name="email" class="form-control" required placeholder="name@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">رقم الهاتف</label>
                        <input type="text" name="phone" class="form-control" placeholder="مثال: 770000000">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">المدينة</label>
                        <input type="text" name="city" class="form-control" value="عدن" placeholder="مثال: عدن">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">كلمة المرور</label>
                        <input type="password" name="password" class="form-control" required placeholder="أدخل كلمة المرور">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mt-3">
                        تسجيل الحساب
                    </button>
                </form>

                <div class="text-center mt-3">
                    <p class="text-muted">لديك حساب بالفعل؟ <a href="{% url 'login' %}" class="text-decoration-none">تسجيل الدخول</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
