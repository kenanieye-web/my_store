{% extends 'shop/base.html' %}
{% block title %}تعديل المنتج{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h3 class="mb-4 text-center fw-bold text-primary">
                        <i class="fa-solid fa-pen-to-square me-2"></i> تعديل المنتج: {{ product.name }}
                    </h3>
                    
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p }}
                        
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">تحديث التعديلات</button>
                            <a href="{% url 'merchant_product_list' %}" class="btn btn-outline-secondary">إلغاء</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
