{% extends 'shop/base.html' %}
{% block title %}تأكيد حذف المنتج{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 text-center">
                <div class="card-body p-5">
                    <i class="fa-solid fa-triangle-exclamation text-danger mb-3" style="font-size: 3rem;"></i>
                    <h4 class="mb-3">تأكيد حذف المنتج</h4>
                    <p class="text-muted mb-4">
                        هل أنت متأكد من حذف المنتج
                        <strong>"{{ product.name }}"</strong>؟
                        <br>
                        هذا الإجراء لا يمكن التراجع عنه.
                    </p>

                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger px-4">
                            <i class="fa-solid fa-trash me-1"></i> نعم، احذف المنتج
                        </button>
                        <a href="{% url 'merchant_product_list' %}" class="btn btn-secondary px-4">
                            إلغاء
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
