<!-- القائمة الجانبية للموبايل -->
<div class="offcanvas offcanvas-start" tabindex="-1" id="mobileMenu">
    <div class="offcanvas-header text-white" style="background-color: #1b5299;">
        <h5 class="offcanvas-title fw-bold">
            <i class="fa-solid fa-store me-2" style="color: #e67e22;"></i> متجر كنان
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body p-0">
        <div class="p-3 bg-light border-bottom">
            <form action="{% url 'product_list' %}" method="GET">
                <div class="input-group">
                    <input type="text" name="q" class="form-control" placeholder="ابحث عن منتج...">
                    <button class="btn btn-kenan-orange" type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>
            </form>
        </div>
        <div class="list-group list-group-flush">
            <a href="{% url 'home' %}" class="list-group-item list-group-item-action py-3">الرئيسية</a>
            <a href="{% url 'product_list' %}" class="list-group-item list-group-item-action py-3">فئات المنتجات</a>
            <a href="{% url 'cart_detail' %}" class="list-group-item list-group-item-action py-3">سلة التسوق</a>
            {% if request.user.is_authenticated %}
                <a href="{% url 'customer_profile' %}" class="list-group-item list-group-item-action py-3">حسابي</a>
            {% else %}
                <a href="{% url 'login' %}" class="list-group-item list-group-item-action py-3">تسجيل الدخول</a>
            {% endif %}
        </div>
    </div>
</div>
